window.loadTweetEmbeds=function(root){
  const cards=[...(root||document).querySelectorAll('.tweet-embed[data-tweet-id]')];
  if(!cards.length)return;
  const render=()=>cards.forEach(card=>{
    if(card.dataset.loaded)return;
    card.dataset.loaded='1';
    const fallback=card.querySelector('.tweet-fallback');
    window.twttr.widgets.createTweet(card.dataset.tweetId,card,{theme:'light',conversation:'none',align:'center',dnt:true}).then(widget=>{
      if(widget&&fallback)fallback.hidden=true;
      if(!widget)card.dataset.loaded='';
    }).catch(()=>{card.dataset.loaded=''});
  });
  if(window.twttr&&window.twttr.widgets){render();return}
  let script=document.querySelector('script[data-x-widgets]');
  if(!script){script=document.createElement('script');script.src='https://platform.twitter.com/widgets.js';script.async=true;script.dataset.xWidgets='1';document.head.appendChild(script)}
  script.addEventListener('load',render,{once:true});
};
(function(){const ITER=250000,f=document.getElementById('form'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}async function unlock(pass){const r=b64(document.getElementById('payload').textContent.trim()),salt=r.slice(0,16),iv=r.slice(16,28),data=r.slice(28),km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data))}f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='여는 중…';try{const app=document.getElementById('app');app.innerHTML=await unlock(pw.value);app.hidden=false;document.getElementById('lock').remove();document.title='도쿄 Fate 여행 · 2026. 8. 15–17';loadTweetEmbeds(app)}catch(x){err.textContent='비밀번호가 틀립니다';pw.value='';pw.focus();go.disabled=false;go.textContent='열기'}});pw.focus()})();</script></body></html>
