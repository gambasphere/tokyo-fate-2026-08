window.loadTweetEmbeds=function(root){
  const cards=[...(root||document).querySelectorAll('.tweet-embed[data-tweet-id]')];
  if(!cards.length)return;
  const render=()=>cards.forEach(card=>{
    if(card.dataset.loaded)return;
    card.dataset.loaded='1';
    const fallback=card.querySelector('.tweet-fallback');
    window.twttr.widgets.createTweet(card.dataset.tweetId,card,{theme:'light',conversation:'none',align:'center',dnt:true}).then(widget=>{
      if(widget&&fallback)fallback.hidden=true;
      if(!widget)card.dataset.loaded='';
    }).catch(()=>{card.dataset.loaded=''});
  });
  if(window.twttr&&window.twttr.widgets){render();return}
  let script=document.querySelector('script[data-x-widgets]');
  if(!script){script=document.createElement('script');script.src='https://platform.twitter.com/widgets.js';script.async=true;script.dataset.xWidgets='1';document.head.appendChild(script)}
  script.addEventListener('load',render,{once:true});
};

window.TRIP_CATS={stay:{c:"#1f2d3d",n:"숙소"},exhibit:{c:"#c0392b",n:"전시"},goods:{c:"#e07b1a",n:"가챠·굿즈"},food:{c:"#0f766e",n:"식당"},cafe:{c:"#c2185b",n:"디저트·카페"},shop:{c:"#7b3fa0",n:"쇼핑"},sight:{c:"#2e7d32",n:"볼거리"},transit:{c:"#546e7a",n:"공항·교통"}};
window.initTripMaps=function(root){
  const els=[...(root||document).querySelectorAll('.trip-map[data-pins]')];
  if(!els.length)return;
  const C=window.TRIP_CATS;
  const draw=()=>els.forEach(el=>{
    if(el.dataset.done)return;
    el.dataset.done='1';
    let pins;try{pins=JSON.parse(el.dataset.pins)}catch(e){el.textContent='지도 데이터를 읽지 못했습니다';return}
    if(!pins.length)return;
    const map=L.map(el).setView([pins[0].lat,pins[0].lng],13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    const pts=[],groups={};
    pins.forEach(p=>{
      const cat=C[p.k]||{c:'#7c6f64',n:'기타'};
      const ic=L.divIcon({className:'',html:'<div class="tm-dot" style="background:'+cat.c+'"></div>',iconSize:[20,20],iconAnchor:[10,20],popupAnchor:[0,-18]});
      const nav='https://www.google.com/maps/search/?api=1&query='+p.lat+','+p.lng;
      const body=(p.d||[]).map(x=>'<div>'+x+'</div>').join('');
      const tag='<span class="tm-tag" style="background:'+cat.c+'">'+cat.n+'</span>';
      const mk=L.marker([p.lat,p.lng],{icon:ic})
        .bindPopup('<b>'+p.n+'</b>'+tag+body+'<a href="'+nav+'" target="_blank" rel="noreferrer">구글맵 길찾기 →</a>');
      (groups[p.k]=groups[p.k]||L.layerGroup()).addLayer(mk);
      pts.push([p.lat,p.lng]);
    });
    Object.values(groups).forEach(g=>g.addTo(map));
    map.fitBounds(L.latLngBounds(pts).pad(0.12));
    setTimeout(()=>map.invalidateSize(),120);
    const leg=el.nextElementSibling;
    if(leg&&leg.classList.contains('tm-legend')){
      leg.innerHTML='';
      Object.keys(C).forEach(k=>{
        if(!groups[k])return;
        const b=document.createElement('button');
        b.type='button';b.className='tm-chip on';b.dataset.k=k;
        b.style.setProperty('--c',C[k].c);
        b.innerHTML='<i></i>'+C[k].n+' <em>'+groups[k].getLayers().length+'</em>';
        b.addEventListener('click',()=>{
          const on=b.classList.toggle('on');
          if(on)groups[k].addTo(map);else map.removeLayer(groups[k]);
        });
        leg.appendChild(b);
      });
    }
  });
  if(window.L){draw();return}
  let s=document.querySelector('script[data-leaflet]');
  if(!s){
    const css=document.createElement('link');
    css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    s=document.createElement('script');
    s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.async=true;s.dataset.leaflet='1';
    document.head.appendChild(s);
  }
  s.addEventListener('load',draw,{once:true});
};
(function(){const ITER=250000,f=document.getElementById('form'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}async function unlock(pass){const r=b64(document.getElementById('payload').textContent.trim()),salt=r.slice(0,16),iv=r.slice(16,28),data=r.slice(28),km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data))}f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='여는 중…';try{const app=document.getElementById('app');app.innerHTML=await unlock(pw.value);app.hidden=false;document.getElementById('lock').remove();document.title='도쿄 Fate 여행 · 2026. 8. 15–17';loadTweetEmbeds(app);initTripMaps(app)}catch(x){err.textContent='비밀번호가 틀립니다';pw.value='';pw.focus();go.disabled=false;go.textContent='열기'}});pw.focus()})();</script></body></html>
